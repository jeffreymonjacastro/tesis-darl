# TableShift is sourced from Git. Its obsolete NumPy, Ray and Torch pins are
# overridden below so it can coexist with the Python 3.12 DARL environment.

[project]
name = "darl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.10.0",
    "tableshift @ git+https://github.com/mlfoundations/tableshift.git@fca9429814703a07e3902d005d46563a207b7f0a",
    "scikit-learn==1.7.2",
    "xgboost==3.2.0",
    "category-encoders==2.8.1",
    "evidently==0.7.21",
    "river==0.22.0",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "matplotlib==3.10.9",
    "ray==2.55.1",
    "ipykernel==7.2.0",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "torch>=2.12.0",
    "ipywidgets>=8.1.8",
    "xport>=3.2.1",
    "fairlearn>=0.14.0",
    "datasets>=5.0.0",
    "torchvision>=0.27.0",
    "folktables>=0.0.12",
    "frozendict>=2.4.7",
    "hyperopt>=0.2.7",
    "h5py>=3.16.0",
    "tables>=3.11.1; python_version >= '3.11'",
    "einops>=0.8.2",
    "tab-transformer-pytorch>=0.6.1",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "kaggle>=2.2.1; python_version >= '3.11'",
    "torchinfo>=1.8.0",
    "stable-baselines3>=2.9.0",
    "gymnasium>=1.3.0",
    "marker-pdf>=2.0.0",
    "markdown-it-py>=4.2.0",
    "setuptools==80.9.0",
]

[tool.uv]
# river 0.23.0 does not have a prebuilt wheel for this Windows setup
constraint-dependencies = ["river<0.23.0"]
override-dependencies = [
    # TableShift pins legacy versions that do not support Python 3.12.
    "numpy==2.2.6",
    "ray==2.55.1",
    "torch>=2.12.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

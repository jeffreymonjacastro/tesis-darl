# tableshift: install separately to avoid dependency conflicts
# pip install --no-deps git+https://github.com/mlfoundations/tableshift.git
# pip install ray  # required at runtime by tableshift

[project]
name = "pfc1"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn==1.7.2",
    "xgboost==3.2.0",
    "category-encoders==2.8.1",
    "evidently==0.7.21",
    "river==0.22.0",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "matplotlib==3.10.9",
    "ray==2.55.1",
    "ipykernel==7.2.0",
]

[tool.uv]
# river 0.23.0 does not have a prebuilt wheel for Windows/Python 3.10
constraint-dependencies = ["river<0.23.0"]
